name: 生成视频编号

on:
  schedule:
    - cron: '*/2 * * * *'  # 每2分钟运行一次
  workflow_dispatch:  # 也可以手动触发

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检查并生成编号
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          SPREADSHEET_TOKEN: GdAVsqJH1hotUuteTwFcx4pdnoe
          SHEET_ID: 1YGgZK
        run: |
          pip install requests -q
          python3 << 'EOF'
          import requests, os, datetime

          app_id = os.environ["FEISHU_APP_ID"]
          app_secret = os.environ["FEISHU_APP_SECRET"]
          spreadsheet_token = os.environ["SPREADSHEET_TOKEN"]
          sheet_id = os.environ["SHEET_ID"]

          # 获取访问令牌
          token_res = requests.post(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              json={"app_id": app_id, "app_secret": app_secret}
          )
          access_token = token_res.json()["tenant_access_token"]
          headers = {"Authorization": f"Bearer {access_token}"}

          # 读取A列和B列（第2行到第50行）
          range_str = f"{sheet_id}!A2:B50"
          res = requests.get(
              f"https://open.feishu.cn/open-apis/sheets/v2/spreadsheets/{spreadsheet_token}/values/{range_str}",
              headers=headers
          )
          rows = res.json().get("data", {}).get("valueRange", {}).get("values", [])

          # 遍历每一行，找B列有内容但A列为空的
          date_str = datetime.datetime.now().strftime("%y%m%d")
          for i, row in enumerate(rows):
              row_num = i + 2  # 实际行号（从第2行开始）
              a_val = row[0] if len(row) > 0 else ""
              b_val = row[1] if len(row) > 1 else ""

              if b_val and not a_val:
                  seq = str(i + 1).zfill(2)  # 01, 02, 03...
                  video_id = f"V{date_str}{seq}"

                  # 写入A列
                  cell = f"{sheet_id}!A{row_num}"
                  requests.put(
                      f"https://open.feishu.cn/open-apis/sheets/v2/spreadsheets/{spreadsheet_token}/values",
                      headers=headers,
                      json={"valueRange": {"range": cell, "values": [[video_id]]}}
                  )
                  print(f"已写入 {video_id} 到第{row_num}行")

          print("检查完成")
          EOF
